<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<title>メダカメーカー</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
	<!-- 左側メニュー -->
	<div class="container">
  		<nav class="sidebar">
			<div>メダカメーカー</div>
				<p></p>
				<div>
					<form action="#" method="post">	体形　
	  					<label>
	    						<input type="radio" name="shape" value="nomal" checked>普通
	  					</label>
					</form>
					<form action="#" method="post">	ヒレ　
					  	<label>
					    		<input type="radio" name="fin" value="nomal" checked>普通
					  	</label>
					  	<label>
					    		<input type="radio" name="fin" value="long">ヒレ長
					  	</label>
					</form>
					<form action="#" method="post">体色　
					  	<label>
					    		<input type="radio" name="color" value="white" checked>白
					  	</label>
					 	 <label>
					    		<input type="radio" name="color" value="black">黒
					  	</label>
						<label>
							<input type="radio" name="color" value="red">赤
						</label>
					</form>
					<form action="#" method="post">
					模様　
					  <label>
					    <input type="radio" name="pattern" value="none" checked>無
					  </label>
					  <label>
					    <input type="radio" name="pattern" value="black">黒
					  </label>
					  <label>
					    <input type="radio" name="pattern" value="red">赤
					  </label>
					</form>
					<form action="#" method="post">
					ラメ　
					  <label>
					    <input type="radio" name="lame" value="none" checked>無
					  </label>
					  <label>
					    <input type="radio" name="lame" value="yes">有
					  </label>
					</form>
					<form action="#" method="post">体外光
					  <label>
					    <input type="radio" name="light" value="none" checked>無
					  </label>
					  <label>
					    <input type="radio" name="light" value="yes">有
					  </label>
					</form>
				</div>
		</nav>
		
		<!-- 右側 -->
		<div class="right">
			<!-- 右上 -->
			<div class="top">上見
			</div>
			<!-- 右下 -->
			<div class="bottom">横見
			</div>
		</div>
	</body>
</html>
